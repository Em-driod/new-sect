<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="form.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

    <section class="firstClass">
            <!--the section that bring the form to the center-->
        <section class="theLarge">

            <form action="">
                <div>
                    <p style="font-size: 30px;"> Welcome Back</p>
                    <p>Enter your credientials to enter this account</p>
                </div>


                <div class="same">
                    <label for="">Email Address</label>
                    <input class="ent" type="text" placeholder="you@example.com">
                </div>


                <div class="same">
                    <label for="">Password</label>
                    <input class="ent" type="password" >
                </div>


                <div class="rem">
                     <section><input type="checkbox"> Remember me</section>
                     <p>forget password?</p>
                </div>
                <button>sign in</button>
                <div class="liner">
                      <div class="line"></div>
                      <p>OR</p>
                      <div class="line"></div>

                </div>
                <div class="icons">
                    <a href="https://accounts.google.com/" target="_blank" rel="noopener noreferrer"
                     aria-label="Sign in with Google">
                        <i class="fa-brands fa-google" aria-hidden="true"></i>Google
                    </a>
                    <a href="https://www.facebook.com/login/" target="_blank" rel="noopener noreferrer" aria-label="Sign in with Facebook">
                        <i class="fa-brands fa-facebook" aria-hidden="true"></i>Facebook
                    </a>
                    <a href="https://www.instagram.com/accounts/login/" target="_blank" rel="noopener noreferrer" aria-label="Sign in with Instagram">
                        <i class="fa-brands fa-instagram" aria-hidden="true"></i>Instagram
                    </a>
                </div>
                <div></div>

            </form>

        </section>

    </section>
    
</body>
</html>
