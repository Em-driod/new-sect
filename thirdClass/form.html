<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form card</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body style="display: flex; justify-content:center; color: blue; background:
  linear-gradient(rgba(255, 0, 0, 0.5), rgba(0, 0, 255, 0.5)),
  url('/thirdClass/images/Good\ for\ summer\'s.jpg');background-repeat: no-repeat; background-size: cover; height: 100vh;">
     <!--this section brings my content to the center-->
    <section style="background: linear-gradient(rgb(0, 0, 0,0.8),black),url(/thirdClass/images/Good\ for\ summer\'s.jpg) ">
        <header style="display: flex; justify-content: center;"> <p> Sign-up form</p></header>

        <form style="display:flex ; flex-direction: column; 
        border: 2px blue solid; justify-content: center; padding: 20px;
          gap:12px; border-radius: 4px;">

            <div style="display: flex; justify-content: center;">
                
                <p style="font-size: 25px;">
                fill in this form
               </p>
        </div>
          <!--this first div is for name imput-->
            <div style="display: flex; flex-direction: column;">
                <label  for="name" style="font-size: 20px; font-style: italic; font-weight: 800;">Name:</label>
                <input type="text" id="name" placeholder="input your name" style="border: none;
                 border-bottom: 1px black solid;">
            </div>
            <!--this second div is for email input-->
            <div style="display: flex; flex-direction: column;">
               <label for="email" style="font-size: 20px; font-style: italic; font-weight: 800;">Email:</label>
               <input type="email" id="email" placeholder="input your email"  style="border: none;
                 border-bottom: 1px black solid;">
            </div>
 
            <div style="display: flex; flex-direction: column;">
                <label for="password" style="font-size: 20px; font-style: italic; font-weight: 800;">Password:</label>
                <input type="password" id="password" placeholder="input your password" style="border: none;
                 border-bottom: 1px black solid;">
            </div>
            <div style="display: flex; justify-content: center;">
                <button style="background-color: blue;color: wheat; padding: 8px;
                 border: 3px brown solid; border-radius: 12px;">submit</button>
            </div>

            <div style="display: flex; justify-content: center; gap: 16px;">
              <a href="https://accounts.google.com/signup" target="_blank" rel="noopener noreferrer"
                 aria-label="Sign up with Google" title="Sign up with Google" style="color: #DB4437; font-size: 28px;">
                <i class="fa-brands fa-google" aria-hidden="true"></i>
              </a>
              <a href="https://www.facebook.com/signup" target="_blank" rel="noopener noreferrer"
                 aria-label="Sign up with Facebook" title="Sign up with Facebook" style="color: #1877F2; font-size: 28px;">
                <i class="fa-brands fa-facebook" aria-hidden="true"></i>
              </a>
              <a href="https://www.instagram.com/accounts/emailsignup/" target="_blank" rel="noopener noreferrer"
                 aria-label="Sign up with Instagram" title="Sign up with Instagram" style="color: #E4405F; font-size: 28px;">
                <i class="fa-brands fa-instagram" aria-hidden="true"></i>
              </a>
            </div>

        </form>
       
    </section>


    
</body>
</html>
